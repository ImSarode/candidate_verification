version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ishaan Sarode", email = "sarode.ishaan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.22",
    "pydantic[email]>=2.14.3",
